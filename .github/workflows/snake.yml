name: Generate Snake

on:
  schedule:
    # Fallback refresh - covers ALL repos (existing and future) with zero
    # per-repo setup. GitHub's minimum cron interval is 5 minutes; under peak
    # load runs may be delayed, and hierarchy_class additionally dispatches an
    # instant snake-refresh event on every push.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
  # Fired by other repos (e.g. hierarchy_class) right after each push, so the
  # snake updates within seconds of committing instead of waiting for cron.
  repository_dispatch:
    types: [snake-refresh]

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2A4052&color_dots=#ebedf0,#d6e2ed,#a7b8c2,#5b7fa0,#3B5263
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C8D6E0&color_dots=#0F1319,#2a4052,#3c5a72,#5b7fa0,#7a9ab8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
